<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes — Day 4</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="note-app">
    <header class="app-header">
      <div>
        <h1>QuickNotes</h1>
        <p>A simple space for your thoughts.</p>
      </div>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <label for="note-text">Your note</label>
    <textarea id="note-text" rows="10" placeholder="Start writing..." aria-describedby="char-count word-count"></textarea>

    <div class="counts" aria-live="polite">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>

    <button id="clear-btn" type="button">Clear note</button>
  </main>
</body>
</html>
