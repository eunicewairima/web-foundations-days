<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 5 - User Directory</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1rem;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    button,
    input {
      padding: 0.6rem 0.75rem;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 4px;
      background: #1d4ed8;
      color: #fff;
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    label {
      display: block;
      margin: 1.25rem 0 0.4rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid #94a3b8;
      border-radius: 4px;
    }

    #status {
      min-height: 1.5em;
    }

    #users-list {
      display: grid;
      gap: 1rem;
      padding: 0;
      list-style: none;
    }

    #users-list li {
      padding: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    #users-list h2,
    #users-list p {
      margin: 0 0 0.35rem;
    }

    #users-list p:last-child {
      margin-bottom: 0;
    }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <main>
    <h1>User Directory</h1>
    <button id="load-users" type="button">Load users</button>

    <label for="filter-input">Filter users by name</label>
    <input id="filter-input" type="search" disabled>

    <p id="status" role="status" aria-live="polite">Load users to see the directory.</p>
    <ul id="users-list" aria-label="Users"></ul>
  </main>
</body>
</html>
